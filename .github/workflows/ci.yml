name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  e2e-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: ko-build/setup-ko@v0.8
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - run: go install github.com/google/go-containerregistry/cmd/registry@latest github.com/google/go-containerregistry/cmd/crane@latest && echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - run: cd app && go test ./...
      - run: pip install pytest pyyaml && pytest -q
      - run: ./scripts/local-e2e.sh
